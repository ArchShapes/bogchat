<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream chat overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { font-synthesis: none; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #chat {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 12px 16px; box-sizing: border-box;
    font-family: "DM Mono", ui-monospace, Menlo, Consolas, monospace; font-weight: 400; letter-spacing: .01em; -webkit-font-smoothing: antialiased;
    font-size: var(--size, 20px); line-height: 1.3; color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 4px rgba(0,0,0,.95), 0 0 12px rgba(0,0,0,.8), 0 0 24px rgba(0,0,0,.6);
  }
  .msg {
    padding: 3px 0; word-wrap: break-word; overflow-wrap: anywhere;
    animation: in .25s ease-out both; transition: opacity .6s ease;
  }
  .msg.out { opacity: 0; }
  .name { font-weight: 500; }
  .name::after { content: ":"; color: #fff; font-weight: 400; margin-right: .35em; }
  .badges { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-right: 5px; vertical-align: baseline; }
  .chat-badge {
    display: inline-block; padding: 1px 5px; border-radius: 3px;
    font: 700 .62em/1.45 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .025em; text-shadow: none; vertical-align: middle; transform: translateY(-.24em);
    color: #fff; background: #53535f;
  }
  .chat-badge.broadcaster { background: #9147ff; }
  .chat-badge.mod { background: #168a48; }
  .chat-badge.vip { background: #e85d9e; }
  .chat-badge.sub { background: #3869c8; }
  .native-badge { display: inline-block; width: 1.05em; height: 1.05em; vertical-align: -.16em; object-fit: contain; }
  .emote { height: 1.5em; vertical-align: middle; margin: -.2em 1px; }

  /* Command/Action notification labels */
  .msg.cmd-label {
    margin: 4px 0; padding: 7px 12px; width: fit-content; max-width: 100%; box-sizing: border-box; text-align: left;
    background: rgba(20,20,30,0.88); border: 1px solid rgba(255,255,255,0.15); border-left: 3px solid #3ec9b0; border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.3); text-shadow: 0 2px 6px rgba(0,0,0,.9);
    animation: msgIn .35s ease-out backwards;
  }
  .msg.cmd-label .cmd-user { font-weight: 700; color: #3ec9b0; }

  /* TTS Banner Label */
  .msg.tts-label {
    margin: 6px 0; padding: 9px 14px; width: fit-content; max-width: 100%; box-sizing: border-box; text-align: left;
    background: rgba(30,20,10,0.9); border: 1px solid rgba(255,196,107,0.4); border-left: 3px solid #ffc46b; border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.4); text-shadow: 0 2px 6px rgba(0,0,0,.9);
    animation: msgIn .35s ease-out backwards;
  }
  .tts-label .tts-header { font-size: 0.8em; font-weight: 700; color: #ffc46b; text-transform: uppercase; margin-bottom: 2px; }
  .tts-label .tts-body { font-size: 1.05em; font-weight: 600; color: #fff; }

  #status {
    position: absolute; top: 8px; right: 12px; font: 12px system-ui, sans-serif;
    color: #9aa; opacity: 0; transition: opacity .4s; text-shadow: none;
  }
  #status.show { opacity: .8; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="chat"></div>
<div id="status"></div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const CHANNEL = params.get("channel") || "bogdanthegdplayer";
  const FADE_S = parseFloat(params.get("fade") ?? "30");
  const MAX_MSG = Math.max(1, parseInt(params.get("max") || "6", 10));
  const TTS_ON = params.get("tts") !== "0";
  const TTS_VOL = 1;

  const chat = document.getElementById("chat");
  const statusEl = document.getElementById("status");
  const setStatus = (t) => { statusEl.textContent = t; statusEl.classList.toggle("show", !!t); };

  function readable(hex, name) {
    if (!/^#[0-9a-f]{6}$/i.test(hex || "")) {
      let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return `hsl(${h % 360} 70% 65%)`;
    }
    return hex;
  }

  function unesc(v) {
    return v.replace(/\\(.)/g, (m, c) => ({ s: " ", ":": ";", "\\": "\\", r: "\r", n: "\n" }[c] ?? c));
  }
  function parseTags(raw) {
    const out = {};
    raw.split(";").forEach(p => { const i = p.indexOf("="); out[p.slice(0, i)] = unesc(p.slice(i + 1)); });
    return out;
  }

  function dismiss(el) {
    if (!el || el._gone) return;
    el._gone = true;
    el.style.animation = "none";
    el.classList.add("out");
    setTimeout(() => el.remove(), 1200);
  }

  function push(el, fade = FADE_S) {
    chat.appendChild(el);
    const all = [...chat.children].filter(e => !e._gone);
    while (all.length > MAX_MSG) dismiss(all.shift());
    if (fade > 0) setTimeout(() => el.remove(), fade * 1000);
    chat.scrollTop = chat.scrollHeight;
  }

  // --- TTS Handling & Label Generation ---
  const ttsQueue = [];
  let ttsBusy = false;

  async function speakText(text) {
    if (!("speechSynthesis" in window)) return;
    return new Promise((resolve) => {
      const u = new SpeechSynthesisUtterance(text);
      u.volume = TTS_VOL;
      u.onend = () => resolve();
      u.onerror = () => resolve();
      window.speechSynthesis.speak(u);
    });
  }

  async function runTts() {
    if (ttsBusy || !ttsQueue.length) return;
    ttsBusy = true;
    const text = ttsQueue.shift();
    await speakText(text);
    ttsBusy = false;
    runTts();
  }

  function handleTts(tags, user, message) {
    if (!TTS_ON) return;
    const text = message.replace(/^!tts\s*/i, "").trim();
    if (!text) return;

    // 1. Create TTS Label Banner instead of chat line
    const displayName = tags["display-name"] || user;
    const el = document.createElement("div");
    el.className = "msg tts-label";
    
    const header = document.createElement("div");
    header.className = "tts-header";
    header.textContent = `${displayName} says:`;

    const body = document.createElement("div");
    body.className = "tts-body";
    body.textContent = text;

    el.append(header, body);
    push(el, 15);

    // 2. Queue audio playback
    ttsQueue.push(text);
    runTts();
  }

  // --- Command Label Handling ---
  function handleCommandLabel(tags, user, commandName) {
    const displayName = tags["display-name"] || user;
    const el = document.createElement("div");
    el.className = "msg cmd-label";
    
    const userSpan = document.createElement("span");
    userSpan.className = "cmd-user";
    userSpan.textContent = displayName;

    el.append(userSpan, document.createTextNode(` just played ${commandName}!`));
    push(el, 8);
  }

  // --- Sound Effects & Command Router ---
  const SFX_NAMES = new Set(["vineboom", "bruh", "cookie", "applause", "airhorn", "meow"]);
  
  function handleCommand(tags, user, message) {
    const cm = message.match(/^!([a-z0-9]+)(?:\s+(.*))?$/i);
    if (!cm) return false;
    const cmd = cm[1].toLowerCase();

    // Check if it's a TTS command
    if (cmd === "tts") {
      handleTts(tags, user, message);
      return true;
    }

    // Check if it's a sound effect / command
    if (SFX_NAMES.has(cmd)) {
      handleCommandLabel(tags, user, cmd);
      // Play dummy audio / sound trigger here if needed
      return true;
    }

    // Default: suppress unknown commands from chat as requested ("commands should NOT appear in chat")
    return true;
  }

  // --- Message Processing ---
  function buildChatLine(tags, user, message) {
    const displayName = tags["display-name"] || user;
    const el = document.createElement("div");
    el.className = "msg";

    const n = document.createElement("span");
    n.className = "name";
    n.textContent = displayName;
    n.style.color = readable(tags.color, displayName);

    const t = document.createElement("span");
    t.className = "text";
    t.textContent = message;

    el.append(n, t);
    return el;
  }

  function addMessage(tags, user, message) {
    // If message starts with '!', treat it as a command -> Filter out from chat and turn into label
    if (message.startsWith("!")) {
      handleCommand(tags, user, message);
      return;
    }

    // Normal chat messages stay in chat
    push(buildChatLine(tags, user, message));
  }

  // --- Twitch WebSocket Connection ---
  function connectTwitch() {
    setStatus("connecting to Twitch…");
    const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

    ws.onopen = () => {
      ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      ws.send("PASS SCHMOOPIIE");
      ws.send("NICK justinfan" + Math.floor(10000 + Math.random() * 89999));
      ws.send("JOIN #" + CHANNEL);
    };

    ws.onmessage = (ev) => {
      ev.data.split("\r\n").filter(Boolean).forEach(line => {
        let tags = {}, rest = line;
        if (rest[0] === "@") { const i = rest.indexOf(" "); tags = parseTags(rest.slice(1, i)); rest = rest.slice(i + 1); }
        if (rest.startsWith("PING")) { ws.send("PONG :tmi.twitch.tv"); return; }

        const parts = rest.match(/^:([^!]+)![^ ]+ PRIVMSG #([^ ]+) :(.*)$/);
        if (parts) {
          const who = parts[1], text = parts[3];
          addMessage(tags, who, text);
        }
      });
    };

    ws.onclose = () => {
      setStatus("reconnecting…");
      setTimeout(connectTwitch, 3000);
    };
  }

  connectTwitch();
})();
</script>
</body>
</html>
